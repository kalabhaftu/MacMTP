name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout MacMTP
      uses: actions/checkout@v4

    - name: Checkout OpenMTP
      uses: actions/checkout@v4
      with:
        repository: ganeshrvel/openmtp
        path: ../openmtp

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6.0'

    - name: Install dependencies
      run: |
        brew install pkg-config libusb create-dmg
        
    - name: Build and Package
      run: |
        bash scripts/release.sh ${{ github.ref_name }}

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/*.dmg
          release/*.zip
          release/*.sha256
          release/latest-mac.yml
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
