name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      MACMTP_ARM64_LIBUSB_PKGCONFIG: /opt/homebrew/opt/libusb/lib/pkgconfig
      MACMTP_X86_64_LIBUSB_PKGCONFIG: /usr/local/opt/libusb/lib/pkgconfig
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

    steps:
    - name: Checkout MacMTP
      uses: actions/checkout@v4

    - name: Checkout OpenMTP
      uses: actions/checkout@v4
      with:
        repository: ganeshrvel/openmtp
        path: openmtp

    - name: Link OpenMTP for build script
      run: ln -s "$GITHUB_WORKSPACE/openmtp" "$GITHUB_WORKSPACE/../openmtp"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install dependencies
      run: |
        brew install pkg-config libusb create-dmg sentry-cli
        softwareupdate --install-rosetta --agree-to-license || true
        if [ ! -x /usr/local/bin/brew ]; then
          NONINTERACTIVE=1 arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        fi
        arch -x86_64 /usr/local/bin/brew install pkg-config libusb

    - name: Build and package all release targets
      run: bash scripts/release.sh "${{ github.ref_name }}" --all
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/*.dmg
          release/*.zip
          release/*.sha256
          release/latest-mac.yml
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
