name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Test and package macMTP
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    concurrency:
      group: macmtp-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    env:
      MACMTP_ARM64_LIBUSB_PKGCONFIG: /opt/homebrew/opt/libusb/lib/pkgconfig
      MACMTP_X86_64_LIBUSB_PKGCONFIG: /usr/local/opt/libusb/lib/pkgconfig

    steps:
    - name: Checkout MacMTP
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install dependencies
      run: |
        brew install pkg-config libusb
        softwareupdate --install-rosetta --agree-to-license || true
        if [ ! -x /usr/local/bin/brew ]; then
          NONINTERACTIVE=1 arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        fi
        arch -x86_64 /usr/local/bin/brew install pkg-config libusb

    - name: Validate scripts
      run: |
        bash -n scripts/*.sh
        bash scripts/test-native-contract.sh
        git diff --check

    - name: Build and verify host release
      run: |
        ARCH="$(uname -m)"
        bash scripts/build.sh release --arch "$ARCH"
        scripts/verify-app.sh macMTP.app "$ARCH"

    - name: Run tests
      run: swift test -v

    - name: Upload verified app bundle
      uses: actions/upload-artifact@v4
      with:
        name: macMTP-${{ runner.arch }}-app
        path: macMTP.app
        if-no-files-found: error
