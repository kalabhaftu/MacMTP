name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: brew install libusb
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v 2>/dev/null || echo "No tests found — skipping"
