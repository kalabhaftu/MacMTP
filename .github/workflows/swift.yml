name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Test and package macMTP
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    concurrency:
      group: macmtp-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - name: Checkout MacMTP
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.22'

    - name: Install dependencies
      run: |
        brew untap aws/tap 2>/dev/null || true
        brew install pkg-config

    - name: Validate scripts
      run: |
        bash -n scripts/*.sh
        bash scripts/test-libusb-build.sh
        bash scripts/test-native-contract.sh
        git diff --check

    - name: Build and verify host release
      run: |
        ARCH="$(uname -m)"
        bash scripts/build.sh release --arch "$ARCH"
        scripts/verify-app.sh macMTP.app "$ARCH"

    - name: Run tests
      run: MACMTP_LIBUSB_LIB_DIR="$PWD/Vendor/libusb/build/$(uname -m)/lib" swift test -v

    - name: Upload verified app bundle
      uses: actions/upload-artifact@v7
      with:
        name: macMTP-${{ runner.arch }}-app
        path: macMTP.app
        if-no-files-found: error
